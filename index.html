<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>M&M Karting – Telemetrie Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Arial,Helvetica,sans-serif;color:white}.stage{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:3%;left:2.2%;display:flex;gap:12px;align-items:center}.brand{padding:11px 16px;background:rgba(4,13,27,.86);border-left:4px solid #2da9ff;border-radius:8px;font-weight:900;letter-spacing:1px;font-size:clamp(12px,1.4vw,23px)}.live{background:#df243b;padding:9px 12px;border-radius:6px;font-size:clamp(11px,1vw,18px);font-weight:900}.bottom{position:absolute;bottom:2.2%;left:2.2%;right:2.2%;display:flex;align-items:stretch;gap:10px;height:clamp(85px,10vw,150px)}.telemetry{display:flex;gap:3px;min-width:49%;max-width:58%;border-radius:10px;overflow:hidden;border:1px solid rgba(91,176,255,.4);box-shadow:0 5px 20px #0008}.metric{background:rgba(5,17,35,.89);padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}.metric.speed{flex:1.05;background:rgba(9,35,64,.94)}.tag{font-size:clamp(9px,.82vw,15px);letter-spacing:1.4px;color:#8acaff;font-weight:800}.value{font-size:clamp(19px,2.25vw,40px);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;margin:5px 0}.unit{font-size:clamp(9px,.8vw,14px);color:#c4d7ed}.sponsor{flex:1;background:rgba(5,17,35,.9);border:1px solid rgba(91,176,255,.4);border-radius:10px;display:flex;align-items:center;gap:16px;padding:10px 17px;min-width:0;box-shadow:0 5px 20px #0008}.sponsor img{height:100%;width:25%;object-fit:contain;background:white;border-radius:6px;padding:4px}.sponsor .copy{min-width:0}.sponsor .eyebrow{color:#8acaff;font-size:clamp(9px,.8vw,14px);font-weight:800;letter-spacing:1px}.sponsor .name{font-size:clamp(13px,1.25vw,22px);font-weight:900;margin:4px 0}.sponsor .details{font-size:clamp(10px,.92vw,16px);color:#d7e5f7;line-height:1.3;overflow-wrap:anywhere}.fade{animation:fade .4s ease}@keyframes fade{from{opacity:.25}to{opacity:1}}.offline .value{color:#f3c474}@media(max-width:650px){.bottom{height:92px;left:1%;right:1%;gap:4px}.metric{padding:6px}.telemetry{min-width:55%}.sponsor{padding:5px;gap:5px}.sponsor img{width:24%}.sponsor .details{font-size:8px}.sponsor .name{font-size:10px}.value{font-size:17px}.brand{font-size:10px;padding:8px}}
</style></head><body><main class="stage"><div class="top"><div class="brand">M&amp;M KARTING RACING TEAM</div><div class="live">● LIVE</div></div><div class="bottom"><section class="telemetry"><div class="metric speed" id="speedbox"><div class="tag">SPEED</div><div class="value" id="speed">—</div><div class="unit">km/h</div></div><div class="metric"><div class="tag">RUNDE <span id="lap">0</span></div><div class="value" id="current">—</div><div class="unit">AKTUELLE ZEIT</div></div><div class="metric"><div class="tag">BEST LAP</div><div class="value" id="best">—</div><div class="unit" id="kart">KART 01</div></div></section><section class="sponsor" id="sponsor"><img id="slogo" src="etiketten.jpeg" alt="Sponsorlogo"><div class="copy"><div class="eyebrow">UNSERE PARTNER</div><div class="name" id="sname"></div><div class="details" id="sdetails"></div></div></section></div></main><script>
const sponsors=[{name:'Etiketten-Meister',address:'Herderstraße 11 · 40721 Hilden',url:'etiketten-meister.de',img:'etiketten.jpeg'},{name:'Allianz Christopher Kehlenbach',address:'Kaiserstraße 62 · 42781 Haan',url:'vertretung.allianz.de/christopher.kehlenbach',img:'allianz.jpeg'},{name:'Outdoor Kartbahn',address:'Raderberg 2 · 41366 Schwalmtal',url:'www.outdoorkartbahn.com',img:'kartbahn.jpeg'},{name:'M&M Handwerkerservice',address:'Herder Straße 13 · 40721 Hilden',url:'mm-handwerker-service.de',img:'handwerk.jpeg'}];let i=0;function sponsor(){let s=sponsors[i%sponsors.length];document.getElementById('slogo').src=s.img;document.getElementById('slogo').alt=s.name;document.getElementById('sname').textContent=s.name;document.getElementById('sdetails').textContent=s.address+' · '+s.url;document.getElementById('sponsor').classList.remove('fade');void document.getElementById('sponsor').offsetWidth;document.getElementById('sponsor').classList.add('fade');i++}sponsor();setInterval(sponsor,7000);
let state={speed:null,lap:0,current:null,best:null,kart:'01'};function fmt(v){if(v===null||v===undefined||v==='')return '—';if(typeof v==='number'){let m=Math.floor(v/60000),s=Math.floor(v%60000/1000),ms=Math.floor(v%1000);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(3,'0')}`}return String(v)}function render(){document.getElementById('speed').textContent=state.speed===null?'—':Math.round(state.speed);document.getElementById('lap').textContent=state.lap;document.getElementById('current').textContent=fmt(state.current);document.getElementById('best').textContent=fmt(state.best);document.getElementById('kart').textContent='KART '+String(state.kart).padStart(2,'0');document.getElementById('speedbox').classList.toggle('offline',state.speed===null)}render();const ch=new BroadcastChannel('mm-karting-telemetry-v1');ch.onmessage=e=>{if(e.data&&typeof e.data==='object'){state={...state,...e.data};render()}};const qs=new URLSearchParams(location.search);if(qs.get('demo')==='1'){let start=Date.now();setInterval(()=>{let t=Date.now()-start;state.speed=65+Math.round(14*Math.sin(t/1700));state.current=t%61000;state.lap=1+Math.floor(t/61000);state.best=56890;render()},100)}
</script></body></html>
